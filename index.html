<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros Style Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }
        
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            z-index: 10;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .overlay h1 {
            font-size: 36px;
            color: #e52521;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #fbd000;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .overlay h2 {
            font-size: 24px;
            color: #fbd000;
            margin-bottom: 20px;
        }
        
        .overlay p {
            font-size: 12px;
            margin: 10px 0;
            color: #fff;
        }
        
        .overlay .controls {
            margin: 20px 0;
            font-size: 10px;
            color: #aaa;
            line-height: 2;
        }
        
        .overlay button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 16px;
            font-family: inherit;
            background: #e52521;
            color: white;
            border: 4px solid #fbd000;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .overlay button:hover {
            background: #fbd000;
            color: #e52521;
            transform: scale(1.1);
        }
        
        .score-display {
            font-size: 18px;
            color: #fbd000;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Start Screen -->
        <div id="startScreen" class="overlay">
            <h1>SUPER MARIO<br>PLATFORMER</h1>
            <div class="controls">
                <p>ARROW KEYS or WASD - Move</p>
                <p>SPACE, UP, or W - Jump</p>
            </div>
            <p>Collect coins, stomp enemies, and reach the end!</p>
            <button id="startBtn">START GAME</button>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p class="score-display">FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // ==================== GAME CONSTANTS ====================
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const TILE_SIZE = 32;
        const GRAVITY = 0.5;
        const PLAYER_SPEED = 4;
        const JUMP_FORCE = -12;
        const ENEMY_SPEED = 1;
        const GAME_TIME = 400;
        
        // Colors
        const SKY_COLOR = '#5c94fc';
        const GROUND_COLOR = '#c84c0c';
        const BRICK_COLOR = '#d87050';
        const BRICK_DARK = '#a03000';
        const QUESTION_COLOR = '#ffa500';
        const QUESTION_DARK = '#b87000';
        const PIPE_GREEN = '#00a800';
        const PIPE_LIGHT = '#5ce65c';
        const PIPE_DARK = '#006800';
        const HILL_COLOR = '#00a800';
        const HILL_DARK = '#006800';
        const CLOUD_COLOR = '#ffffff';
        const COIN_COLOR = '#ffd700';
        
        // ==================== GAME STATE ====================
        let canvas, ctx;
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let coins = 0;
        let lives = 3;
        let time = GAME_TIME;
        let cameraX = 0;
        let frameCount = 0;
        let lastTime = 0;
        
        // Input state
        const keys = {};
        
        // Game objects
        let player;
        let platforms = [];
        let questionBlocks = [];
        let brickBlocks = [];
        let pipes = [];
        let enemies = [];
        let collectibleCoins = [];
        let particles = [];
        let floatingTexts = [];
        let clouds = [];
        let hills = [];
        
        // Level dimensions
        const LEVEL_WIDTH = 200; // tiles
        const LEVEL_HEIGHT = 19; // tiles
        const GROUND_Y = CANVAS_HEIGHT - TILE_SIZE * 2;
        
        // ==================== PLAYER CLASS ====================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 28;
                this.height = 32;
                this.velX = 0;
                this.velY = 0;
                this.grounded = false;
                this.facingRight = true;
                this.invincible = false;
                this.invincibleTimer = 0;
                this.visible = true;
                this.walkFrame = 0;
                this.walkTimer = 0;
            }
            
            update() {
                // Horizontal movement
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    this.velX = -PLAYER_SPEED;
                    this.facingRight = false;
                } else if (keys['ArrowRight'] || keys['KeyD']) {
                    this.velX = PLAYER_SPEED;
                    this.facingRight = true;
                } else {
                    this.velX *= 0.8;
                    if (Math.abs(this.velX) < 0.1) this.velX = 0;
                }
                
                // Walking animation
                if (Math.abs(this.velX) > 0.5 && this.grounded) {
                    this.walkTimer++;
                    if (this.walkTimer > 6) {
                        this.walkFrame = (this.walkFrame + 1) % 3;
                        this.walkTimer = 0;
                    }
                } else {
                    this.walkFrame = 0;
                }
                
                // Jumping
                if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && this.grounded) {
                    this.velY = JUMP_FORCE;
                    this.grounded = false;
                }
                
                // Apply gravity
                this.velY += GRAVITY;
                if (this.velY > 15) this.velY = 15;
                
                // Update position
                this.x += this.velX;
                this.y += this.velY;
                
                // Prevent moving off left edge
                if (this.x < cameraX) this.x = cameraX;
                
                // Invincibility
                if (this.invincible) {
                    this.invincibleTimer--;
                    this.visible = Math.floor(this.invincibleTimer / 4) % 2 === 0;
                    if (this.invincibleTimer <= 0) {
                        this.invincible = false;
                        this.visible = true;
                    }
                }
                
                // Check for falling into pit
                if (this.y > CANVAS_HEIGHT + 50) {
                    this.die();
                }
            }
            
            draw() {
                if (!this.visible) return;
                
                const screenX = this.x - cameraX;
                ctx.save();
                
                if (!this.facingRight) {
                    ctx.translate(screenX + this.width / 2, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-this.width / 2, 0);
                } else {
                    ctx.translate(screenX, 0);
                }
                
                // Draw Mario-style character
                const y = this.y;
                
                // Red hat
                ctx.fillStyle = '#e52521';
                ctx.fillRect(8, y, 14, 6);
                ctx.fillRect(4, y + 6, 20, 4);
                
                // Face (skin tone)
                ctx.fillStyle = '#ffa07a';
                ctx.fillRect(4, y + 10, 18, 8);
                
                // Hair
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(2, y + 10, 4, 4);
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(14, y + 12, 3, 3);
                
                // Mustache
                ctx.fillRect(10, y + 15, 10, 2);
                
                // Blue overalls
                ctx.fillStyle = '#0000cd';
                ctx.fillRect(4, y + 18, 20, 10);
                
                // Red shirt visible on sides
                ctx.fillStyle = '#e52521';
                ctx.fillRect(2, y + 18, 4, 6);
                ctx.fillRect(22, y + 18, 4, 6);
                
                // Hands (skin)
                ctx.fillStyle = '#ffa07a';
                ctx.fillRect(0, y + 20, 4, 4);
                ctx.fillRect(24, y + 20, 4, 4);
                
                // Brown shoes
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(4, y + 28, 8, 4);
                ctx.fillRect(16, y + 28, 8, 4);
                
                ctx.restore();
            }
            
            hit() {
                if (this.invincible) return;
                
                lives--;
                if (lives <= 0) {
                    gameState = 'gameover';
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('gameOverScreen').classList.remove('hidden');
                } else {
                    this.invincible = true;
                    this.invincibleTimer = 120;
                }
            }
            
            die() {
                lives--;
                if (lives <= 0) {
                    gameState = 'gameover';
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('gameOverScreen').classList.remove('hidden');
                } else {
                    // Reset player position
                    this.x = 100;
                    this.y = GROUND_Y - this.height;
                    this.velX = 0;
                    this.velY = 0;
                    cameraX = 0;
                    this.invincible = true;
                    this.invincibleTimer = 120;
                }
            }
        }
        
        // ==================== BLOCK CLASSES ====================
        class Platform {
            constructor(x, y, width, height, type = 'ground') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
            }
            
            draw() {
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                const tilesX = Math.ceil(this.width / TILE_SIZE);
                const tilesY = Math.ceil(this.height / TILE_SIZE);
                
                for (let tx = 0; tx < tilesX; tx++) {
                    for (let ty = 0; ty < tilesY; ty++) {
                        const bx = screenX + tx * TILE_SIZE;
                        const by = this.y + ty * TILE_SIZE;
                        drawGroundBlock(bx, by);
                    }
                }
            }
        }
        
        class QuestionBlock {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE;
                this.height = TILE_SIZE;
                this.hit = false;
                this.bounceOffset = 0;
                this.bouncing = false;
            }
            
            onHit() {
                if (this.hit) return;
                this.hit = true;
                this.bouncing = true;
                this.bounceOffset = -8;
                
                // Spawn coin
                coins++;
                score += 200;
                
                // Create floating score text
                floatingTexts.push(new FloatingText(this.x, this.y - 10, '200', '#fff'));
                
                // Create particles
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(
                        this.x + TILE_SIZE / 2,
                        this.y,
                        COIN_COLOR
                    ));
                }
            }
            
            update() {
                if (this.bouncing) {
                    this.bounceOffset += 2;
                    if (this.bounceOffset >= 0) {
                        this.bounceOffset = 0;
                        this.bouncing = false;
                    }
                }
            }
            
            draw() {
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                const y = this.y + this.bounceOffset;
                
                if (this.hit) {
                    // Empty block
                    ctx.fillStyle = '#8b7355';
                    ctx.fillRect(screenX, y, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#6b5344';
                    ctx.fillRect(screenX + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                } else {
                    // Question block
                    ctx.fillStyle = QUESTION_COLOR;
                    ctx.fillRect(screenX, y, TILE_SIZE, TILE_SIZE);
                    
                    // Border
                    ctx.fillStyle = QUESTION_DARK;
                    ctx.fillRect(screenX, y, TILE_SIZE, 3);
                    ctx.fillRect(screenX, y + TILE_SIZE - 3, TILE_SIZE, 3);
                    ctx.fillRect(screenX, y, 3, TILE_SIZE);
                    ctx.fillRect(screenX + TILE_SIZE - 3, y, 3, TILE_SIZE);
                    
                    // Question mark
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 18px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', screenX + TILE_SIZE / 2, y + TILE_SIZE / 2 + 6);
                }
            }
        }
        
        class BrickBlock {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE;
                this.height = TILE_SIZE;
                this.broken = false;
                this.bounceOffset = 0;
                this.bouncing = false;
            }
            
            onHit() {
                this.bouncing = true;
                this.bounceOffset = -4;
            }
            
            update() {
                if (this.bouncing) {
                    this.bounceOffset += 1;
                    if (this.bounceOffset >= 0) {
                        this.bounceOffset = 0;
                        this.bouncing = false;
                    }
                }
            }
            
            draw() {
                if (this.broken) return;
                
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                const y = this.y + this.bounceOffset;
                drawBrickBlock(screenX, y);
            }
        }
        
        class Pipe {
            constructor(x, y, height) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE * 2;
                this.height = height;
            }
            
            draw() {
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                // Pipe top
                ctx.fillStyle = PIPE_GREEN;
                ctx.fillRect(screenX - 4, this.y, this.width + 8, TILE_SIZE);
                
                // Pipe body
                ctx.fillRect(screenX, this.y + TILE_SIZE, this.width, this.height - TILE_SIZE);
                
                // Highlights
                ctx.fillStyle = PIPE_LIGHT;
                ctx.fillRect(screenX - 4, this.y, 8, TILE_SIZE);
                ctx.fillRect(screenX, this.y + TILE_SIZE, 8, this.height - TILE_SIZE);
                
                // Shadows
                ctx.fillStyle = PIPE_DARK;
                ctx.fillRect(screenX + this.width - 4, this.y, 8, TILE_SIZE);
                ctx.fillRect(screenX + this.width - 8, this.y + TILE_SIZE, 8, this.height - TILE_SIZE);
                
                // Top lip shadow
                ctx.fillRect(screenX - 4, this.y + TILE_SIZE - 4, this.width + 8, 4);
            }
        }
        
        // ==================== ENEMY CLASS ====================
        class Goomba {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.velX = -ENEMY_SPEED;
                this.velY = 0;
                this.grounded = false;
                this.alive = true;
                this.squished = false;
                this.squishTimer = 0;
                this.walkFrame = 0;
                this.walkTimer = 0;
            }
            
            update() {
                if (!this.alive) {
                    if (this.squished) {
                        this.squishTimer--;
                        if (this.squishTimer <= 0) {
                            return false; // Remove enemy
                        }
                    }
                    return true;
                }
                
                // Walking animation
                this.walkTimer++;
                if (this.walkTimer > 15) {
                    this.walkFrame = (this.walkFrame + 1) % 2;
                    this.walkTimer = 0;
                }
                
                // Apply gravity
                this.velY += GRAVITY;
                if (this.velY > 10) this.velY = 10;
                
                // Move
                this.x += this.velX;
                this.y += this.velY;
                
                // Simple boundary check for direction change
                // More sophisticated collision handling done in main update
                
                return true;
            }
            
            stomp() {
                this.alive = false;
                this.squished = true;
                this.squishTimer = 30;
                this.height = 10;
                score += 100;
                floatingTexts.push(new FloatingText(this.x, this.y - 10, '100', '#fff'));
            }
            
            draw() {
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                if (this.squished) {
                    // Squished goomba
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(screenX, this.y + 20, this.width, 10);
                    return;
                }
                
                // Goomba body (mushroom shape)
                ctx.fillStyle = '#8b4513';
                
                // Head (rounded top)
                ctx.beginPath();
                ctx.ellipse(screenX + 15, this.y + 10, 15, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Body
                ctx.fillRect(screenX + 5, this.y + 15, 20, 10);
                
                // Feet
                const footOffset = this.walkFrame * 4 - 2;
                ctx.fillStyle = '#4a2500';
                ctx.fillRect(screenX + 2 - footOffset, this.y + 22, 10, 8);
                ctx.fillRect(screenX + 18 + footOffset, this.y + 22, 10, 8);
                
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX + 6, this.y + 8, 6, 6);
                ctx.fillRect(screenX + 18, this.y + 8, 6, 6);
                
                // Pupils
                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 8, this.y + 10, 3, 3);
                ctx.fillRect(screenX + 20, this.y + 10, 3, 3);
                
                // Eyebrows (angry look)
                ctx.fillStyle = '#4a2500';
                ctx.fillRect(screenX + 5, this.y + 5, 8, 3);
                ctx.fillRect(screenX + 17, this.y + 5, 8, 3);
            }
        }
        
        // ==================== COLLECTIBLES ====================
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.width = 20;
                this.height = 24;
                this.collected = false;
                this.bobOffset = Math.random() * Math.PI * 2;
            }
            
            update() {
                // Bobbing animation
                this.y = this.baseY + Math.sin(frameCount * 0.1 + this.bobOffset) * 4;
            }
            
            draw() {
                if (this.collected) return;
                
                const screenX = this.x - cameraX;
                if (screenX + this.width < 0 || screenX > CANVAS_WIDTH) return;
                
                // Gold coin
                ctx.fillStyle = COIN_COLOR;
                ctx.beginPath();
                ctx.ellipse(screenX + 10, this.y + 12, 8, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Shine
                ctx.fillStyle = '#ffec8b';
                ctx.beginPath();
                ctx.ellipse(screenX + 7, this.y + 8, 3, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            collect() {
                if (this.collected) return;
                this.collected = true;
                coins++;
                score += 100;
                floatingTexts.push(new FloatingText(this.x, this.y - 10, '100', '#fff'));
                
                // Particles
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(this.x + 10, this.y + 12, COIN_COLOR));
                }
            }
        }
        
        // ==================== EFFECTS ====================
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velX = (Math.random() - 0.5) * 6;
                this.velY = Math.random() * -8 - 2;
                this.life = 30;
                this.size = 4 + Math.random() * 4;
            }
            
            update() {
                this.x += this.velX;
                this.y += this.velY;
                this.velY += 0.3;
                this.life--;
                return this.life > 0;
            }
            
            draw() {
                const screenX = this.x - cameraX;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 30;
                ctx.fillRect(screenX, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }
        
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.life = 60;
                this.velY = -2;
            }
            
            update() {
                this.y += this.velY;
                this.life--;
                return this.life > 0;
            }
            
            draw() {
                const screenX = this.x - cameraX;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.min(1, this.life / 30);
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, screenX, this.y);
                ctx.globalAlpha = 1;
            }
        }
        
        // ==================== DECORATIONS ====================
        class Cloud {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speed = 0.2 + Math.random() * 0.3;
            }
            
            update() {
                this.x += this.speed;
                if (this.x > LEVEL_WIDTH * TILE_SIZE + 200) {
                    this.x = -100;
                }
            }
            
            draw() {
                const screenX = this.x - cameraX * 0.3; // Parallax effect
                
                ctx.fillStyle = CLOUD_COLOR;
                const s = this.size;
                
                // Cloud puffs
                ctx.beginPath();
                ctx.arc(screenX, this.y, s * 0.6, 0, Math.PI * 2);
                ctx.arc(screenX + s, this.y, s * 0.8, 0, Math.PI * 2);
                ctx.arc(screenX + s * 2, this.y, s * 0.6, 0, Math.PI * 2);
                ctx.arc(screenX + s * 0.5, this.y - s * 0.4, s * 0.5, 0, Math.PI * 2);
                ctx.arc(screenX + s * 1.5, this.y - s * 0.4, s * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        class Hill {
            constructor(x, size) {
                this.x = x;
                this.size = size;
            }
            
            draw() {
                const screenX = this.x - cameraX * 0.5; // Parallax
                
                // Main hill
                ctx.fillStyle = HILL_COLOR;
                ctx.beginPath();
                ctx.moveTo(screenX - this.size, GROUND_Y);
                ctx.quadraticCurveTo(screenX, GROUND_Y - this.size * 0.8, screenX + this.size, GROUND_Y);
                ctx.fill();
                
                // Spots on hill
                ctx.fillStyle = HILL_DARK;
                const spotCount = Math.floor(this.size / 30);
                for (let i = 0; i < spotCount; i++) {
                    const spotX = screenX - this.size * 0.6 + (i * this.size * 1.2 / spotCount);
                    const spotY = GROUND_Y - 20 - Math.random() * (this.size * 0.3);
                    ctx.beginPath();
                    ctx.arc(spotX, spotY, 5 + Math.random() * 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // ==================== DRAWING FUNCTIONS ====================
        function drawGroundBlock(x, y) {
            // Main block
            ctx.fillStyle = GROUND_COLOR;
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            
            // Brick pattern
            ctx.fillStyle = BRICK_DARK;
            
            // Horizontal lines
            ctx.fillRect(x, y, TILE_SIZE, 2);
            ctx.fillRect(x, y + TILE_SIZE / 2, TILE_SIZE, 2);
            
            // Vertical lines (offset pattern)
            ctx.fillRect(x, y, 2, TILE_SIZE / 2);
            ctx.fillRect(x + TILE_SIZE / 2, y, 2, TILE_SIZE / 2);
            ctx.fillRect(x + TILE_SIZE / 4, y + TILE_SIZE / 2, 2, TILE_SIZE / 2);
            ctx.fillRect(x + TILE_SIZE * 3 / 4, y + TILE_SIZE / 2, 2, TILE_SIZE / 2);
        }
        
        function drawBrickBlock(x, y) {
            // Main block
            ctx.fillStyle = BRICK_COLOR;
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            
            // Brick pattern
            ctx.fillStyle = BRICK_DARK;
            
            // Lines
            ctx.fillRect(x, y, TILE_SIZE, 2);
            ctx.fillRect(x, y + 10, TILE_SIZE, 2);
            ctx.fillRect(x, y + 20, TILE_SIZE, 2);
            ctx.fillRect(x, y + 30, TILE_SIZE, 2);
            
            // Vertical lines
            ctx.fillRect(x, y, 2, 10);
            ctx.fillRect(x + 16, y, 2, 10);
            ctx.fillRect(x + 8, y + 10, 2, 10);
            ctx.fillRect(x + 24, y + 10, 2, 10);
            ctx.fillRect(x, y + 20, 2, 10);
            ctx.fillRect(x + 16, y + 20, 2, 10);
        }
        
        function drawHUD() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CANVAS_WIDTH, 40);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            
            // MARIO label and score
            ctx.fillText('MARIO', 30, 15);
            ctx.fillText(String(score).padStart(6, '0'), 30, 32);
            
            // Coins
            ctx.fillStyle = COIN_COLOR;
            ctx.fillText('×' + String(coins).padStart(2, '0'), 180, 25);
            
            // World
            ctx.fillStyle = '#fff';
            ctx.fillText('WORLD', 320, 15);
            ctx.fillText('1-1', 330, 32);
            
            // Time
            ctx.fillText('TIME', 500, 15);
            ctx.fillText(String(Math.ceil(time)).padStart(3, '0'), 505, 32);
            
            // Lives
            ctx.fillText('LIVES', 650, 15);
            ctx.fillStyle = '#e52521';
            ctx.fillText('×' + lives, 660, 32);
        }
        
        // ==================== LEVEL GENERATION ====================
        function createLevel() {
            platforms = [];
            questionBlocks = [];
            brickBlocks = [];
            pipes = [];
            enemies = [];
            collectibleCoins = [];
            clouds = [];
            hills = [];
            
            // Create clouds
            for (let i = 0; i < 20; i++) {
                clouds.push(new Cloud(
                    i * 400 + Math.random() * 200,
                    60 + Math.random() * 100,
                    20 + Math.random() * 20
                ));
            }
            
            // Create hills
            for (let i = 0; i < 15; i++) {
                hills.push(new Hill(
                    i * 500 + Math.random() * 200,
                    80 + Math.random() * 60
                ));
            }
            
            // Ground sections with gaps
            const groundSections = [
                { start: 0, end: 69 },
                { start: 72, end: 86 },
                { start: 89, end: 120 },
                { start: 123, end: 140 },
                { start: 143, end: 200 }
            ];
            
            for (const section of groundSections) {
                platforms.push(new Platform(
                    section.start * TILE_SIZE,
                    GROUND_Y,
                    (section.end - section.start) * TILE_SIZE,
                    TILE_SIZE * 2
                ));
            }
            
            // Question blocks row 1 (low)
            const qBlocksLow = [16, 21, 22, 23, 78, 94, 106, 109, 112, 129, 130, 131];
            for (const x of qBlocksLow) {
                questionBlocks.push(new QuestionBlock(x * TILE_SIZE, GROUND_Y - TILE_SIZE * 4));
            }
            
            // Question blocks row 2 (high)
            const qBlocksHigh = [22, 108, 110, 130];
            for (const x of qBlocksHigh) {
                questionBlocks.push(new QuestionBlock(x * TILE_SIZE, GROUND_Y - TILE_SIZE * 8));
            }
            
            // Brick blocks
            const brickPositions = [
                { x: 20, y: 4 }, { x: 24, y: 4 },
                { x: 77, y: 4 }, { x: 79, y: 4 },
                { x: 80, y: 8 }, { x: 81, y: 8 }, { x: 82, y: 8 }, { x: 83, y: 8 },
                { x: 91, y: 4 }, { x: 92, y: 4 }, { x: 93, y: 4 },
                { x: 100, y: 4 }, { x: 101, y: 4 },
                { x: 107, y: 4 }, { x: 108, y: 4 }, { x: 111, y: 4 },
                { x: 118, y: 8 }, { x: 119, y: 8 }, { x: 120, y: 8 },
                { x: 128, y: 4 }, { x: 132, y: 4 },
            ];
            
            for (const pos of brickPositions) {
                brickBlocks.push(new BrickBlock(pos.x * TILE_SIZE, GROUND_Y - TILE_SIZE * pos.y));
            }
            
            // Pipes
            const pipePositions = [
                { x: 28, height: TILE_SIZE * 2 },
                { x: 38, height: TILE_SIZE * 3 },
                { x: 46, height: TILE_SIZE * 4 },
                { x: 57, height: TILE_SIZE * 4 },
                { x: 163, height: TILE_SIZE * 2 },
                { x: 179, height: TILE_SIZE * 2 },
            ];
            
            for (const pipe of pipePositions) {
                pipes.push(new Pipe(
                    pipe.x * TILE_SIZE,
                    GROUND_Y - pipe.height,
                    pipe.height
                ));
            }
            
            // Stair formations
            // First stair (going up)
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j <= i; j++) {
                    platforms.push(new Platform(
                        (134 + i) * TILE_SIZE,
                        GROUND_Y - (j + 1) * TILE_SIZE,
                        TILE_SIZE,
                        TILE_SIZE
                    ));
                }
            }
            
            // Second stair (going down)
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4 - i; j++) {
                    platforms.push(new Platform(
                        (138 + i) * TILE_SIZE,
                        GROUND_Y - (j + 1) * TILE_SIZE,
                        TILE_SIZE,
                        TILE_SIZE
                    ));
                }
            }
            
            // End stairs (flag pole area)
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j <= i; j++) {
                    platforms.push(new Platform(
                        (186 + i) * TILE_SIZE,
                        GROUND_Y - (j + 1) * TILE_SIZE,
                        TILE_SIZE,
                        TILE_SIZE
                    ));
                }
            }
            
            // Floating platforms
            const floatingPlatforms = [
                { x: 85, y: 6, width: 3 },
                { x: 95, y: 5, width: 4 },
                { x: 115, y: 6, width: 3 },
            ];
            
            for (const fp of floatingPlatforms) {
                platforms.push(new Platform(
                    fp.x * TILE_SIZE,
                    GROUND_Y - fp.y * TILE_SIZE,
                    fp.width * TILE_SIZE,
                    TILE_SIZE
                ));
            }
            
            // Enemies (Goombas)
            const enemyPositions = [
                22, 40, 51, 52, 80, 82, 97, 98, 114, 125, 126, 150, 170, 175
            ];
            
            for (const x of enemyPositions) {
                enemies.push(new Goomba(x * TILE_SIZE, GROUND_Y - 32));
            }
            
            // Collectible coins
            const coinPositions = [
                { x: 17, y: 6 }, { x: 18, y: 6 }, { x: 19, y: 6 },
                { x: 41, y: 3 }, { x: 42, y: 3 }, { x: 43, y: 3 },
                { x: 64, y: 3 }, { x: 65, y: 3 },
                { x: 85, y: 8 }, { x: 86, y: 8 }, { x: 87, y: 8 },
                { x: 95, y: 7 }, { x: 96, y: 7 }, { x: 97, y: 7 }, { x: 98, y: 7 },
                { x: 115, y: 8 }, { x: 116, y: 8 }, { x: 117, y: 8 },
                { x: 155, y: 3 }, { x: 156, y: 3 }, { x: 157, y: 3 },
            ];
            
            for (const pos of coinPositions) {
                collectibleCoins.push(new Coin(pos.x * TILE_SIZE, GROUND_Y - pos.y * TILE_SIZE));
            }
        }
        
        // ==================== COLLISION DETECTION ====================
        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }
        
        function handlePlatformCollisions(entity, platformList) {
            entity.grounded = false;
            
            for (const platform of platformList) {
                if (!checkCollision(entity, platform)) continue;
                
                // Calculate overlap
                const overlapX = Math.min(entity.x + entity.width, platform.x + platform.width) - 
                                 Math.max(entity.x, platform.x);
                const overlapY = Math.min(entity.y + entity.height, platform.y + platform.height) - 
                                 Math.max(entity.y, platform.y);
                
                if (overlapX < overlapY) {
                    // Horizontal collision
                    if (entity.x < platform.x) {
                        entity.x = platform.x - entity.width;
                    } else {
                        entity.x = platform.x + platform.width;
                    }
                    if (entity.velX !== undefined) {
                        entity.velX = entity === player ? 0 : -entity.velX;
                    }
                } else {
                    // Vertical collision
                    if (entity.y < platform.y) {
                        // Landing on top
                        entity.y = platform.y - entity.height;
                        entity.velY = 0;
                        entity.grounded = true;
                    } else {
                        // Hitting from below
                        entity.y = platform.y + platform.height;
                        entity.velY = 0;
                    }
                }
            }
        }
        
        function handleBlockCollisions(entity, blockList, isPlayer = false) {
            for (const block of blockList) {
                if (block.broken || block.hit && block.constructor.name === 'QuestionBlock') continue;
                if (!checkCollision(entity, block)) continue;
                
                const overlapX = Math.min(entity.x + entity.width, block.x + block.width) - 
                                 Math.max(entity.x, block.x);
                const overlapY = Math.min(entity.y + entity.height, block.y + block.height) - 
                                 Math.max(entity.y, block.y);
                
                if (overlapX < overlapY) {
                    // Horizontal collision
                    if (entity.x < block.x) {
                        entity.x = block.x - entity.width;
                    } else {
                        entity.x = block.x + block.width;
                    }
                    if (entity.velX !== undefined) {
                        entity.velX = entity === player ? 0 : -entity.velX;
                    }
                } else {
                    // Vertical collision
                    if (entity.y < block.y) {
                        // Landing on top
                        entity.y = block.y - entity.height;
                        entity.velY = 0;
                        entity.grounded = true;
                    } else {
                        // Hitting from below
                        entity.y = block.y + block.height;
                        entity.velY = 0;
                        if (isPlayer && block.onHit) {
                            block.onHit();
                        }
                    }
                }
            }
        }
        
        function handlePipeCollisions(entity) {
            for (const pipe of pipes) {
                if (!checkCollision(entity, pipe)) continue;
                
                const overlapX = Math.min(entity.x + entity.width, pipe.x + pipe.width) - 
                                 Math.max(entity.x, pipe.x);
                const overlapY = Math.min(entity.y + entity.height, pipe.y + pipe.height) - 
                                 Math.max(entity.y, pipe.y);
                
                if (overlapX < overlapY) {
                    // Horizontal collision
                    if (entity.x < pipe.x) {
                        entity.x = pipe.x - entity.width;
                    } else {
                        entity.x = pipe.x + pipe.width;
                    }
                    if (entity.velX !== undefined) {
                        entity.velX = entity === player ? 0 : -entity.velX;
                    }
                } else {
                    // Vertical collision
                    if (entity.y < pipe.y) {
                        // Landing on top
                        entity.y = pipe.y - entity.height;
                        entity.velY = 0;
                        entity.grounded = true;
                    }
                }
            }
        }
        
        // ==================== GAME LOOP ====================
        function update() {
            if (gameState !== 'playing') return;
            
            frameCount++;
            
            // Update timer
            if (frameCount % 60 === 0) {
                time--;
                if (time <= 0) {
                    player.die();
                    time = GAME_TIME;
                }
            }
            
            // Update player
            player.update();
            
            // Platform collisions for player
            handlePlatformCollisions(player, platforms);
            handleBlockCollisions(player, questionBlocks, true);
            handleBlockCollisions(player, brickBlocks, true);
            handlePipeCollisions(player);
            
            // Update camera
            const targetCameraX = player.x - CANVAS_WIDTH / 3;
            cameraX = Math.max(0, Math.min(targetCameraX, LEVEL_WIDTH * TILE_SIZE - CANVAS_WIDTH));
            
            // Update question blocks
            for (const block of questionBlocks) {
                block.update();
            }
            
            // Update brick blocks
            for (const block of brickBlocks) {
                block.update();
            }
            
            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // Only update enemies near the player
                if (Math.abs(enemy.x - player.x) > CANVAS_WIDTH) continue;
                
                if (!enemy.update()) {
                    enemies.splice(i, 1);
                    continue;
                }
                
                if (enemy.alive) {
                    // Enemy collisions with platforms
                    handlePlatformCollisions(enemy, platforms);
                    handlePipeCollisions(enemy);
                    
                    // Player-enemy collision
                    if (checkCollision(player, enemy)) {
                        // Check if player is stomping (coming from above)
                        if (player.velY > 0 && player.y + player.height - 10 < enemy.y + enemy.height / 2) {
                            enemy.stomp();
                            player.velY = JUMP_FORCE * 0.6; // Bounce
                        } else {
                            player.hit();
                        }
                    }
                }
            }
            
            // Update coins
            for (const coin of collectibleCoins) {
                coin.update();
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collect();
                }
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                }
            }
            
            // Update floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                if (!floatingTexts[i].update()) {
                    floatingTexts.splice(i, 1);
                }
            }
            
            // Update clouds
            for (const cloud of clouds) {
                cloud.update();
            }
        }
        
        function draw() {
            // Clear canvas with sky color
            ctx.fillStyle = SKY_COLOR;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Draw hills (background)
            for (const hill of hills) {
                hill.draw();
            }
            
            // Draw clouds
            for (const cloud of clouds) {
                cloud.draw();
            }
            
            // Draw platforms
            for (const platform of platforms) {
                platform.draw();
            }
            
            // Draw pipes
            for (const pipe of pipes) {
                pipe.draw();
            }
            
            // Draw brick blocks
            for (const block of brickBlocks) {
                block.draw();
            }
            
            // Draw question blocks
            for (const block of questionBlocks) {
                block.draw();
            }
            
            // Draw coins
            for (const coin of collectibleCoins) {
                coin.draw();
            }
            
            // Draw enemies
            for (const enemy of enemies) {
                enemy.draw();
            }
            
            // Draw player
            if (player) {
                player.draw();
            }
            
            // Draw particles
            for (const particle of particles) {
                particle.draw();
            }
            
            // Draw floating texts
            for (const text of floatingTexts) {
                text.draw();
            }
            
            // Draw HUD
            drawHUD();
        }
        
        function gameLoop(currentTime) {
            // Calculate delta time for smooth animation
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            update();
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // ==================== INITIALIZATION ====================
        function initGame() {
            score = 0;
            coins = 0;
            lives = 3;
            time = GAME_TIME;
            cameraX = 0;
            frameCount = 0;
            particles = [];
            floatingTexts = [];
            
            createLevel();
            player = new Player(100, GROUND_Y - 40);
        }
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameState = 'playing';
            initGame();
        }
        
        // ==================== EVENT LISTENERS ====================
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // Prevent default for game keys
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        
        // ==================== START ====================
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Start the game loop
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
